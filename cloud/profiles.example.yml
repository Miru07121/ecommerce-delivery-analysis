ecommerce_delivery_cloud:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: ecommerce_analytics
      location: US
      threads: 1
      priority: interactive
      maximum_bytes_billed: 1000000000
      job_execution_timeout_seconds: 120
